# Prometheus scrape configuration for the local observability profile.
# Start with: docker compose --profile observability up -d
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: bamboo11y
    metrics_path: /metrics
    static_configs:
      - targets: ["bamboo11y:8000"]
        labels:
          service: bamboo11y
          environment: container
