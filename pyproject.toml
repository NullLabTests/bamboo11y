[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-ra --strict-markers"
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated.*:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.coverage.run]
source = ["backend/app"]
branch = true
omit = ["backend/tests/*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "S", "C4", "PT"]
ignore = [
  "S101",
  "B008",
  "SIM108",
  "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["S105", "S106", "S311", "PLR2004"]
"backend/app/services/demo.py" = ["S311"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
