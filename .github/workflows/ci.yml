name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Ruff lint
        run: ruff check backend scripts
      - name: Ruff format
        run: ruff format --check backend scripts
      - name: Pytest with coverage
        run: PYTHONPATH=backend pytest backend/tests -q --cov --cov-report=term-missing:skip-covered

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: ESLint
        run: npm run lint
        working-directory: frontend
      - name: TypeScript
        run: npm run typecheck
        working-directory: frontend
      - name: Vitest
        run: npm run test
        working-directory: frontend
      - name: Production build
        run: npm run build
        working-directory: frontend

  configuration:
    name: Configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Validate catalog, settings, Compose, CI, secrets
        run: PYTHONPATH=backend python scripts/validate_config.py

  container:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t bamboo11y:ci .
      - name: Smoke test image
        run: |
          docker run -d --name bamboo11y-ci -p 18000:8000 bamboo11y:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18000/readyz >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18000/readyz
          curl -fsS http://127.0.0.1:18000/healthz
          docker logs bamboo11y-ci
      - name: Stop container
        if: always()
        run: docker rm -f bamboo11y-ci || true
